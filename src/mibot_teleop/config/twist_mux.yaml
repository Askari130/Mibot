twist_mux:
  ros__parameters:
    topics:
      keyboard:
        topic:    /cmd_vel_key
        timeout:  0.5
        priority: 10       # medium — a keyboard user overrides Nav2
      joystick:
        topic:    /cmd_vel_joy
        timeout:  0.5
        priority: 20       # highest — a human on a gamepad wins
      navigation:
        topic:    /cmd_vel_nav
        timeout:  0.5
        priority: 5        # lowest — Nav2 only when nothing else is talking
